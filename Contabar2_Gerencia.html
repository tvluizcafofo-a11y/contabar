<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Dashboard - Fecha a Conta</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg-1:#eef3fb;--bg-2:#fdf6e8;--panel:#fff;--panel-2:#f5f8fd;--text:#1a2841;--text-strong:#0f172a;--muted:#64748b;--accent:#2563eb;--on-accent:#fff;--danger:#ef4444;--border:#dde5f0;--yellow:#fbbf24;--green:#10b981;--purple:#8b5cf6;--pink:#ec4899;--card-bg:#fff;--card-shadow:0 4px 20px rgba(30,64,175,.07);--input-bg:#fff;--input-focus-ring:0 0 0 3px rgba(37,99,235,.15);--title-color:#1e40af;--money-color:#1d4ed8;--header-bg:linear-gradient(135deg,#2563eb 0%,#1e40af 100%);--header-border:#fbbf24;--err-bg:#fee2e2}
[data-theme="dark"]{--bg-1:#0d1016;--bg-2:#171d29;--panel:#191e28;--panel-2:#222938;--text:#f4f7fb;--text-strong:#fff;--muted:#aeb8c8;--accent:#39c97a;--on-accent:#092114;--danger:#ef5d67;--border:#30394a;--card-bg:#191e28;--card-shadow:0 4px 20px rgba(0,0,0,.35);--input-bg:#10151f;--input-focus-ring:0 0 0 3px rgba(57,201,122,.2);--title-color:#79e9aa;--money-color:#8df0b8;--header-bg:linear-gradient(180deg,#161d2b 0%,#0d1016 100%);--header-border:#39c97a;--err-bg:rgba(239,93,103,.15)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 100%);background-attachment:fixed;color:var(--text);min-height:100vh;transition:background .25s ease,color .25s ease}
header{background:var(--header-bg);padding:14px 20px;border-bottom:3px solid var(--header-border);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.15)}
header h1{margin:0;font-size:20px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
header .sub{font-size:11px;opacity:.9;letter-spacing:.5px;margin-top:3px;display:flex;align-items:center;gap:6px}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap}
.hdr-btns button{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.hdr-btns button:hover{background:rgba(255,255,255,.3)}
.container{max-width:1400px;margin:auto;padding:20px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--card-shadow)}
.card h2{margin:0 0 14px 0;font-size:16px;color:var(--title-color);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--card-shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.kpi.green::before{background:var(--green)}.kpi.yellow::before{background:var(--yellow)}.kpi.purple::before{background:var(--purple)}.kpi.pink::before{background:var(--pink)}
.kpi .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:900;color:var(--text-strong);line-height:1.1}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
.controls{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:var(--card-shadow)}
.ctrl-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ctrl{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.ctrl label{font-size:10px;font-weight:bold;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
select,input[type=date]{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;width:100%}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:var(--input-focus-ring)}
.btn{padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);font-weight:bold;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--panel-2);color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.5px;font-weight:bold}
.money{font-weight:bold;color:var(--money-color);text-align:right;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.tag.pix{background:rgba(37,99,235,.12);color:var(--accent)}
.tag.dinheiro{background:rgba(16,185,129,.15);color:#059669}
.tag.cartao{background:rgba(251,191,36,.2);color:#b45309}
.tag.outro{background:rgba(100,116,139,.15);color:var(--muted)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1000px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--card-shadow)}
.chart-card .chart-hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chart-card h3{margin:0;font-size:15px;color:var(--title-color)}
.chart-tools{display:flex;gap:6px;flex-wrap:wrap}
.chart-tools select{padding:6px 10px;font-size:12px;border-radius:6px;min-width:110px}
.chart-box{position:relative;height:320px;width:100%}
@media(max-width:650px){.chart-box{height:260px}}
.scroll{max-height:500px;overflow-y:auto}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:64px;margin-bottom:12px}
.empty h2{color:var(--text);margin:0 0 8px 0}
.empty p{margin:0 0 16px 0;line-height:1.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters button{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:12px;font-weight:bold}
.filters button.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 Dashboard · Fecha a Conta</h1>
    <div class="sub" id="hdrSub">Análise de Consumo</div>
  </div>
  <div class="hdr-btns">
    <button onclick="toggleTheme()" id="themeBtn">🌙 Tema</button>
    <button onclick="reloadLS()">🔄 Atualizar</button>
  </div>
</header>

<div class="container">
  <!-- Tela de vazio / erro -->
  <div id="noData" class="empty" style="display:none">
    <div class="big">📭</div>
    <h2 id="noDataTitle">Sem dados encontrados</h2>
    <p id="noDataText">Não foi possível ler os dados do aplicativo.</p>
    <button class="btn" onclick="reloadLS()">🔄 Tentar novamente</button>
  </div>

  <!-- Dashboard -->
  <div id="dash" style="display:none">
    <div class="controls">
      <div class="ctrl-row">
        <div class="ctrl"><label>📅 Período</label>
          <select id="periodSelect" onchange="onPeriodChange()">
            <option value="all" selected>Tudo</option>
            <option value="thisMonth">Este mês</option>
            <option value="lastMonth">Mês passado</option>
            <option value="last3">Últimos 3 meses</option>
            <option value="last6">Últimos 6 meses</option>
            <option value="thisYear">Este ano</option>
            <option value="lastYear">Ano passado</option>
            <option value="custom">Personalizado</option>
          </select>
        </div>
        <div class="ctrl" id="cFrom" style="display:none"><label>De</label><input type="date" id="dateFrom" onchange="applyFilters()"></div>
        <div class="ctrl" id="cTo" style="display:none"><label>Até</label><input type="date" id="dateTo" onchange="applyFilters()"></div>
        <div class="ctrl"><label>🏢 Estabelecimento</label><select id="estabFilter" onchange="applyFilters()"><option value="">Todos</option></select></div>
        <div class="ctrl"><label>💳 Pagamento</label><select id="payFilter" onchange="applyFilters()"><option value="">Todos</option><option>PIX</option><option>Dinheiro</option><option>Cartão</option></select></div>
        <div class="ctrl" style="flex:0 0 auto;min-width:auto"><label>&nbsp;</label><button class="btn secondary" onclick="exportCSV()">📤 CSV</button></div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-hdr">
          <h3>📈 Evolução</h3>
          <div class="chart-tools">
            <select id="timeGroup" onchange="renderTimeChart()"><option value="month">Por Mês</option><option value="day">Por Dia</option><option value="week">Por Semana</option></select>
            <select id="timeType" onchange="renderTimeChart()"><option value="bar">Coluna</option><option value="line">Linha</option><option value="area">Área</option><option value="radar">Radar</option></select>
            <select id="timeMetric" onchange="renderTimeChart()"><option value="total">R$ Total</option><option value="count">Nº Contas</option><option value="avg">Ticket Médio</option></select>
          </div>
        </div>
        <div class="chart-box"><canvas id="timeChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-hdr">
          <h3>🥧 Distribuição</h3>
          <div class="chart-tools">
            <select id="distGroup" onchange="renderDistChart()"><option value="estab">Estabelecimento</option><option value="pay">Pagamento</option></select>
            <select id="distType" onchange="renderDistChart()"><option value="doughnut">Rosca</option><option value="pie">Pizza</option><option value="bar">Coluna</option><option value="polarArea">Polar</option></select>
          </div>
        </div>
        <div class="chart-box"><canvas id="distChart"></canvas></div>
      </div>
    </div>

    <div class="card">
      <h2>📅 Comparação Mensal</h2>
      <div id="monthComparison" style="overflow-x:auto"></div>
    </div>

    <div class="charts-grid">
      <div class="card"><h2>🏆 Top Estabelecimentos</h2><div id="topEstabs"></div></div>
      <div class="card"><h2>🍺 Top Produtos</h2><div id="topProducts"></div></div>
    </div>

    <div class="card">
      <h2>📋 Registros <span id="recCount" style="font-size:12px;color:var(--muted);font-weight:normal"></span></h2>
      <div class="filters" id="filtros"></div>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>data</th><th>Mês</th><th>Estab.</th><th>Cliente</th><th>Pagto</th><th class="money">Total</th></tr></thead>
        <tbody id="tbodyRec"></tbody>
      </table></div>
    </div>
  </div>
</div>

<footer id="footerTxt">📊 Dashboard · Fecha a Conta</footer>

<script>
var LS_KEY = 'contaBarVoz_v1';
var THEME_KEY = 'fechaContaDash_theme';
var appData = { historico: [] };
var filtered = [];
var lastUpdateTime = null;
var timeChart = null, distChart = null;
var filtroAtual = 'todos';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

/* PARSING ROBUSTO */
function extractMonth(dataStr, id) {
  if (dataStr != null) {
    var s = String(dataStr).trim();
    if (s) {
      var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if (m) {
        var dia = parseInt(m[1], 10);
        var mes = parseInt(m[2], 10);
        var ano = parseInt(m[3], 10);
        if (ano < 100) ano += (ano < 70 ? 2000 : 1900);
        if (mes > 12 && dia <= 12) { var tmp = dia; dia = mes; mes = tmp; }
        if (dia >= 1 && dia <= 31 && mes >= 1 && mes <= 12 && ano >= 2000 && ano <= 2100) {
          return { key: ano + '-' + String(mes).padStart(2,'0'), ano: ano, mes: mes, dia: dia, source: 'data' };
        }
      }
    }
  }
  if (id != null) {
    var n = (typeof id === 'number') ? id : Number(id);
    if (!isNaN(n)) {
      if (n > 1e9 && n < 1e12) n = n * 1000;
      if (n > 1e12) {
        var d = new Date(n);
        if (!isNaN(d.getTime())) {
          var y = d.getFullYear(), mo = d.getMonth() + 1;
          if (y >= 2000 && y <= 2100) {
            return { key: y + '-' + String(mo).padStart(2,'0'), ano: y, mes: mo, dia: d.getDate(), source: 'id' };
          }
        }
      }
    }
  }
  return { key: null, source: null };
}

function toMoney(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v).trim().replace(/[R$\s\u00a0\u202f]/g, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g,'').replace(',','.');
  else if (s.indexOf(',') >= 0) s = s.replace(',','.');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtMonthLabel(key) {
  if (!key) return '—';
  var parts = key.split('-');
  var y = parts[0], m = parts[1];
  var M = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var idx = parseInt(m,10) - 1;
  if (isNaN(idx) || idx < 0 || idx > 11) return key;
  return M[idx] + '/' + (y||'').slice(-2);
}

/* TEMA */
function applyTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  var btn = $('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '☀️ Tema' : '🌙 Tema';
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  setTimeout(function(){ if (appData.historico.length) { renderTimeChart(); renderDistChart(); } }, 60);
}

/* LEITURA DIRETA DO LOCALSTORAGE */
function reloadLS() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      showNoData("Sem dados encontrados", "O aplicativo Fecha a Conta ainda não salvou nenhuma conta neste navegador/dispositivo.<br><br>Abra o app, registre uma conta e depois volte aqui.");
      return;
    }
    
    var p = JSON.parse(raw);
    if (!p || !Array.isArray(p.historico)) {
      showNoData("Formato inválido", "Os dados salvos não contém um histórico de contas válido.");
      return;
    }
    
    appData = p;
    lastUpdateTime = new Date();
    init();
  } catch (e) {
    showNoData("Erro ao ler dados", "Ocorreu um erro ao acessar a memória do navegador:<br><code>" + e.message + "</code>");
  }
}

function showNoData(title, msg) {
  $('noDataTitle').innerHTML = title;
  $('noDataText').innerHTML = msg;
  $('noData').style.display = 'block';
  $('dash').style.display = 'none';
  $('hdrSub').textContent = 'Sem dados';
  $('footerTxt').textContent = '📊 Dashboard · Fecha a Conta';
}

/* INIT E RENDER */
function init() {
  if (!appData.historico || appData.historico.length === 0) {
    showNoData("Histórico vazio", "O app não possui nenhuma conta registrada no histórico.<br><br>Abra o app e feche uma conta para ver os dados aqui.");
    return;
  }
  
  $('noData').style.display = 'none';
  $('dash').style.display = 'block';
  
  var timeStr = lastUpdateTime ? lastUpdateTime.toLocaleTimeString('pt-BR') : '';
  $('hdrSub').innerHTML = appData.historico.length + ' contas · Atualizado às ' + timeStr;
  $('footerTxt').innerHTML = '📊 Dashboard · Fecha a Conta · Lendo dados do localStorage';
  
  populateEstabFilter();
  applyFilters();
}

/* FILTROS */
function onPeriodChange() {
  var p = $('periodSelect').value;
  $('cFrom').style.display = p === 'custom' ? 'flex' : 'none';
  $('cTo').style.display = p === 'custom' ? 'flex' : 'none';
  applyFilters();
}

function getPeriodRange() {
  var p = $('periodSelect').value;
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  var from = null, to = null;
  if (p === 'thisMonth') { from = new Date(now.getFullYear(), now.getMonth(), 1); to = today; }
  else if (p === 'lastMonth') { from = new Date(now.getFullYear(), now.getMonth()-1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59); }
  else if (p === 'last3') { from = new Date(now.getFullYear(), now.getMonth()-2, 1); to = today; }
  else if (p === 'last6') { from = new Date(now.getFullYear(), now.getMonth()-5, 1); to = today; }
  else if (p === 'thisYear') { from = new Date(now.getFullYear(), 0, 1); to = today; }
  else if (p === 'lastYear') { from = new Date(now.getFullYear()-1, 0, 1); to = new Date(now.getFullYear()-1, 11, 31, 23, 59, 59); }
  else if (p === 'custom') {
    var fv = $('dateFrom').value, tv = $('dateTo').value;
    if (fv) { var p1 = fv.split('-'); from = new Date(+p1[0], +p1[1]-1, +p1[2]); }
    if (tv) { var p2 = tv.split('-'); to = new Date(+p2[0], +p2[1]-1, +p2[2], 23, 59, 59); }
  }
  return { from: from, to: to };
}

function applyFilters() {
  var range = getPeriodRange();
  var from = range.from, to = range.to;
  var estab = $('estabFilter').value;
  var pay = $('payFilter').value;
  var isAll = !from && !to;
  filtered = [];
  appData.historico.forEach(function(h) {
    var info = extractMonth(h.data, h.id);
    if (!info.key) {
      if (!isAll) return;
    } else {
      var d = new Date(info.ano, info.mes - 1, info.dia);
      if (from && d < from) return;
      if (to && d > to) return;
    }
    if (estab && h.estabelecimento !== estab) return;
    if (pay && h.metodoPagamento !== pay) return;
    filtered.push(h);
  });
  render();
}

/* RENDERIZAÇÃO */
function render() {
  renderKPIs();
  renderTimeChart();
  renderDistChart();
  renderMonthComparison();
  renderTopEstabs();
  renderTopProducts();
  renderTable();
}

function renderKPIs() {
  var total = 0, count = filtered.length, biggest = 0, items = 0;
  filtered.forEach(function(h) {
    var t = toMoney(h.total);
    total += t;
    if (t > biggest) biggest = t;
    (h.itens || []).forEach(function(it){ items += (Number(it.qtd) || 0); });
  });
  var avg = count > 0 ? total / count : 0;

  var now = new Date();
  var thisKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var lastDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  var lastKey = lastDate.getFullYear() + '-' + String(lastDate.getMonth()+1).padStart(2,'0');
  var thisTotal = 0, lastTotal = 0;
  filtered.forEach(function(h) {
    var info = extractMonth(h.data, h.id);
    if (!info.key) return;
    var t = toMoney(h.total);
    if (info.key === thisKey) thisTotal += t;
    if (info.key === lastKey) lastTotal += t;
  });
  
  var deltaHtml = '<div class="sub">—</div>';
  if (lastTotal > 0) {
    var d = ((thisTotal - lastTotal) / lastTotal) * 100;
    var arrow = d > 0 ? '▲' : '▼';
    var color = d > 0 ? '#ef4444' : '#059669';
    deltaHtml = '<div class="sub">Mês atual: <b style="color:' + color + '">' + arrow + ' ' + Math.abs(d).toFixed(1) + '%</b> vs anterior</div>';
  }

  var monthly = {};
  filtered.forEach(function(h) {
    var info = extractMonth(h.data, h.id);
    if (!info.key) return;
    if (!monthly[info.key]) monthly[info.key] = 0;
    monthly[info.key] += toMoney(h.total);
  });
  var mVals = Object.keys(monthly).map(function(k){ return monthly[k]; });
  var mAvg = mVals.length ? mVals.reduce(function(a,b){return a+b;},0) / mVals.length : 0;

  $('kpis').innerHTML =
    '<div class="kpi"><div class="lbl">💰 Total</div><div class="val">' + money(total) + '</div>' + deltaHtml + '</div>' +
    '<div class="kpi green"><div class="lbl">🧾 Contas</div><div class="val">' + count + '</div><div class="sub">' + items + ' itens</div></div>' +
    '<div class="kpi yellow"><div class="lbl">🎯 Ticket Médio</div><div class="val">' + money(avg) + '</div></div>' +
    '<div class="kpi purple"><div class="lbl">📈 Maior</div><div class="val">' + money(biggest) + '</div></div>' +
    '<div class="kpi pink"><div class="lbl">📅 Média/Mês</div><div class="val">' + money(mAvg) + '</div></div>';
}

function groupTimeSeries() {
  var grp = $('timeGroup').value;
  var groups = {};
  filtered.forEach(function(h) {
    var info = extractMonth(h.data, h.id);
    if (!info.key) return;
    var key, label;
    if (grp === 'month') { key = info.key; label = fmtMonthLabel(key); }
    else if (grp === 'week') {
      var d = new Date(info.ano, info.mes-1, info.dia);
      var start = new Date(d.getFullYear(), 0, 1);
      var w = Math.ceil((((d - start) / 86400000) + start.getDay() + 1) / 7);
      key = info.ano + '-S' + String(w).padStart(2,'0');
      label = 'Sem ' + w;
    } else {
      key = info.key + '-' + String(info.dia).padStart(2,'0');
      label = String(info.dia).padStart(2,'0') + '/' + String(info.mes).padStart(2,'0');
    }
    if (!groups[key]) groups[key] = { label: label, total: 0, count: 0 };
    groups[key].total += toMoney(h.total);
    groups[key].count += 1;
  });
  return Object.keys(groups).sort().map(function(k){ var g = groups[k]; g.key = k; return g; });
}

function renderTimeChart() {
  if (typeof Chart === 'undefined') return;
  var metric = $('timeMetric').value;
  var type = $('timeType').value;
  var series = groupTimeSeries();
  var labels = series.map(function(s){ return s.label; });
  var values;
  if (metric === 'count') values = series.map(function(s){ return s.count; });
  else if (metric === 'avg') values = series.map(function(s){ return s.count > 0 ? s.total / s.count : 0; });
  else values = series.map(function(s){ return s.total; });
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var accent = isDark ? '#39c97a' : '#2563eb';
  var gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  var textColor = isDark ? '#aeb8c8' : '#64748b';
  if (timeChart) { timeChart.destroy(); timeChart = null; }
  var chartType = type === 'area' ? 'line' : type;
  timeChart = new Chart($('timeChart'), {
    type: chartType,
    data: { labels: labels, datasets: [{
      label: metric === 'count' ? 'Contas' : metric === 'avg' ? 'Ticket Médio' : 'Total (R$)',
      data: values,
      backgroundColor: (chartType === 'line' || chartType === 'radar') ? (isDark ? 'rgba(57,201,122,.15)' : 'rgba(37,99,235,.15)') : accent,
      borderColor: accent, borderWidth: 2,
      fill: type === 'area', tension: .3,
      pointBackgroundColor: accent, pointBorderColor: isDark ? '#0d1016' : '#fff',
      pointRadius: chartType === 'line' ? 4 : 0, pointHoverRadius: 6,
      borderRadius: chartType === 'bar' ? 6 : 0
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function(ctx){ var v = Number(ctx.raw) || 0; return metric === 'count' ? v + ' contas' : money(v); } } }
      },
      scales: chartType === 'radar' ? {
        r: { ticks: { color: textColor, backdropColor: 'transparent' }, grid: { color: gridColor }, angleLines: { color: gridColor }, pointLabels: { color: textColor } }
      } : {
        x: { ticks: { color: textColor, maxRotation: 45 }, grid: { color: gridColor } },
        y: { beginAtZero: true, ticks: { color: textColor, callback: function(v){ return metric === 'count' ? v : 'R$ ' + v.toLocaleString('pt-BR'); } }, grid: { color: gridColor } }
      }
    }
  });
}

function renderDistChart() {
  if (typeof Chart === 'undefined') return;
  var grp = $('distGroup').value;
  var type = $('distType').value;
  var groups = {};
  filtered.forEach(function(h) {
    var k = grp === 'estab' ? (h.estabelecimento || '—') : (h.metodoPagamento || 'Não informado');
    if (!groups[k]) groups[k] = 0;
    groups[k] += toMoney(h.total);
  });
  var entries = Object.keys(groups).map(function(k){ return [k, groups[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var labels = entries.map(function(e){ return e[0]; });
  var values = entries.map(function(e){ return e[1]; });
  var palette = ['#2563eb','#10b981','#fbbf24','#8b5cf6','#ec4899','#0ea5e9','#f97316','#14b8a6','#a855f7','#ef4444','#84cc16','#06b6d4'];
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var textColor = isDark ? '#aeb8c8' : '#64748b';
  var gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  if (distChart) { distChart.destroy(); distChart = null; }
  var isCircular = ['pie','doughnut','polarArea'].indexOf(type) >= 0;
  distChart = new Chart($('distChart'), {
    type: type,
    data: { labels: labels, datasets: [{
      data: values,
      backgroundColor: palette.slice(0, Math.max(labels.length, 1)),
      borderColor: isDark ? '#191e28' : '#fff', borderWidth: 2
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: isCircular ? 'bottom' : 'top', labels: { color: textColor, boxWidth: 12, padding: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: function(ctx){
          var v = Number(ctx.raw) || 0;
          var total = ctx.dataset.data.reduce(function(a,b){ return a+b; }, 0);
          var pct = total > 0 ? ((v / total) * 100).toFixed(1) : 0;
          return ctx.label + ': ' + money(v) + ' (' + pct + '%)';
        } } }
      },
      scales: isCircular ? {} : {
        x: { ticks: { color: textColor }, grid: { color: gridColor } },
        y: { beginAtZero: true, ticks: { color: textColor, callback: function(v){ return 'R$ ' + v.toLocaleString('pt-BR'); } }, grid: { color: gridColor } }
      }
    }
  });
}

function renderMonthComparison() {
  var groups = {};
  var invalidTotal = 0, invalidCount = 0;
  filtered.forEach(function(h) {
    var info = extractMonth(h.data, h.id);
    var tot = toMoney(h.total);
    if (!info.key) { invalidTotal += tot; invalidCount++; return; }
    if (!groups[info.key]) groups[info.key] = { total: 0, count: 0, items: 0 };
    groups[info.key].total += tot;
    groups[info.key].count++;
    (h.itens || []).forEach(function(it){ groups[info.key].items += (Number(it.qtd) || 0); });
  });
  var keys = Object.keys(groups).sort();
  if (keys.length === 0 && invalidCount === 0) { $('monthComparison').innerHTML = '<div class="empty" style="padding:20px">Sem dados no período</div>'; return; }
  var html = '<table><thead><tr><th>Mês</th><th class="money">Total</th><th class="money">Contas</th><th class="money">Itens</th><th class="money">Ticket Médio</th><th class="money">Variação</th></tr></thead><tbody>';
  var prev = null;
  keys.forEach(function(k) {
    var g = groups[k];
    var delta = '<span style="color:var(--muted)">—</span>';
    if (prev !== null && prev > 0) {
      var d = ((g.total - prev) / prev) * 100;
      if (Math.abs(d) < 0.05) delta = '<span style="color:var(--muted)">0%</span>';
      else if (d > 0) delta = '<span style="color:#ef4444">▲ ' + d.toFixed(1) + '%</span>';
      else delta = '<span style="color:#059669">▼ ' + Math.abs(d).toFixed(1) + '%</span>';
    }
    html += '<tr><td><b>' + fmtMonthLabel(k) + '</b></td><td class="money">' + money(g.total) + '</td><td class="money">' + g.count + '</td><td class="money">' + g.items + '</td><td class="money">' + money(g.count ? g.total / g.count : 0) + '</td><td class="money">' + delta + '</td></tr>';
    prev = g.total;
  });
  if (invalidCount > 0) {
    html += '<tr style="background:var(--err-bg)"><td><b>⚠️ Sem data</b></td><td class="money">' + money(invalidTotal) + '</td><td class="money">' + invalidCount + '</td><td colspan="3"></td></tr>';
  }
  html += '</tbody></table>';
  $('monthComparison').innerHTML = html;
}

function renderTopEstabs() {
  var groups = {};
  filtered.forEach(function(h) {
    var k = h.estabelecimento || '—';
    if (!groups[k]) groups[k] = { total: 0, count: 0 };
    groups[k].total += toMoney(h.total);
    groups[k].count++;
  });
  var entries = Object.keys(groups).map(function(k){ return [k, groups[k]]; }).sort(function(a,b){ return b[1].total - a[1].total; }).slice(0, 8);
  if (entries.length === 0) { $('topEstabs').innerHTML = '<div class="empty" style="padding:20px">Sem dados</div>'; return; }
  var max = entries[0][1].total || 1;
  var html = '<table><thead><tr><th>#</th><th>Estabelecimento</th><th class="money">Total</th><th class="money">Contas</th></tr></thead><tbody>';
  entries.forEach(function(e, i) {
    html += '<tr><td>' + (i+1) + '</td><td><div>' + esc(e[0]) + '</div><div style="height:4px;background:var(--panel-2);border-radius:2px;margin-top:4px;overflow:hidden"><div style="height:100%;width:' + (e[1].total/max*100).toFixed(0) + '%;background:var(--accent);border-radius:2px"></div></div></td><td class="money">' + money(e[1].total) + '</td><td class="money">' + e[1].count + '</td></tr>';
  });
  html += '</tbody></table>';
  $('topEstabs').innerHTML = html;
}

function renderTopProducts() {
  var groups = {};
  filtered.forEach(function(h) {
    (h.itens || []).forEach(function(it) {
      var k = it.nome || '—';
      if (!groups[k]) groups[k] = { total: 0, qty: 0 };
      groups[k].total += toMoney(it.preco) * (Number(it.qtd) || 0);
      groups[k].qty += (Number(it.qtd) || 0);
    });
  });
  var entries = Object.keys(groups).map(function(k){ return [k, groups[k]]; }).sort(function(a,b){ return b[1].total - a[1].total; }).slice(0, 8);
  if (entries.length === 0) { $('topProducts').innerHTML = '<div class="empty" style="padding:20px">Sem dados</div>'; return; }
  var max = entries[0][1].total || 1;
  var html = '<table><thead><tr><th>#</th><th>Produto</th><th class="money">Qtd</th><th class="money">Total</th></tr></thead><tbody>';
  entries.forEach(function(e, i) {
    html += '<tr><td>' + (i+1) + '</td><td><div>' + esc(e[0]) + '</div><div style="height:4px;background:var(--panel-2);border-radius:2px;margin-top:4px;overflow:hidden"><div style="height:100%;width:' + (e[1].total/max*100).toFixed(0) + '%;background:var(--green);border-radius:2px"></div></div></td><td class="money">' + e[1].qty + '</td><td class="money">' + money(e[1].total) + '</td></tr>';
  });
  html += '</tbody></table>';
  $('topProducts').innerHTML = html;
}

function renderTable() {
  var all = appData.historico.map(function(h, i) { return { idx: i, h: h, info: extractMonth(h.data, h.id) }; });
  
  var counts = {
    todos: all.length,
    out: all.filter(function(x){ return x.info.key === '2026-10'; }).length,
    sep: all.filter(function(x){ return x.info.key === '2026-09'; }).length
  };
  
  var btns = '<button class="' + (filtroAtual === 'todos' ? 'active' : '') + '" onclick="setFiltro(\'todos\')">Todos (' + counts.todos + ')</button>';
  if (counts.sep > 0) btns += '<button class="' + (filtroAtual === 'sep' ? 'active' : '') + '" onclick="setFiltro(\'sep\')">Set/26 (' + counts.sep + ')</button>';
  if (counts.out > 0) btns += '<button class="' + (filtroAtual === 'out' ? 'active' : '') + '" onclick="setFiltro(\'out\')">Out/26 (' + counts.out + ')</button>';
  $('filtros').innerHTML = btns;

  var items = all.slice();
  if (filtroAtual === 'out') items = items.filter(function(x){ return x.info.key === '2026-10'; });
  else if (filtroAtual === 'sep') items = items.filter(function(x){ return x.info.key === '2026-09'; });

  items.sort(function(a, b) {
    if (!a.info.key && !b.info.key) return 0;
    if (!a.info.key) return 1;
    if (!b.info.key) return -1;
    return b.info.key.localeCompare(a.info.key) || (b.info.dia - a.info.dia);
  });

  $('recCount').textContent = '(' + items.length + ' registros)';

  var html = '';
  items.forEach(function(x) {
    var mp = x.h.metodoPagamento || 'Não informado';
    var mpClass = mp === 'PIX' ? 'pix' : mp === 'Dinheiro' ? 'dinheiro' : mp === 'Cartão' ? 'cartao' : 'outro';
    var rowStyle = !x.info.source ? 'background:var(--err-bg)' : '';
    html += '<tr style="' + rowStyle + '">' +
      '<td>' + (x.idx + 1) + '</td>' +
      '<td class="mono">' + esc(x.h.data) + '</td>' +
      '<td><b>' + (x.info.key ? fmtMonthLabel(x.info.key) : '—') + '</b></td>' +
      '<td>' + esc(x.h.estabelecimento || '—') + '</td>' +
      '<td>' + esc(x.h.cliente || '—') + '</td>' +
      '<td><span class="tag ' + mpClass + '">' + esc(mp) + '</span></td>' +
      '<td class="money">' + money(toMoney(x.h.total)) + '</td>' +
    '</tr>';
  });
  $('tbodyRec').innerHTML = html || '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">Nenhum registro</td></tr>';
}

function setFiltro(f) { filtroAtual = f; renderTable(); }

function populateEstabFilter() {
  var set = {};
  appData.historico.forEach(function(h){ if (h.estabelecimento) set[h.estabelecimento] = 1; });
  var sel = $('estabFilter');
  var cur = sel.value;
  var html = '<option value="">Todos</option>';
  Object.keys(set).sort().forEach(function(o){ html += '<option value="' + esc(o) + '">' + esc(o) + '</option>'; });
  sel.innerHTML = html;
  if (cur) sel.value = cur;
}

function exportCSV() {
  if (filtered.length === 0) { alert('Nada para exportar.'); return; }
  var headers = ['data','mes','estabelecimento','cliente','metodoPagamento','subtotal','gorjeta','total'];
  var rows = filtered.map(function(h) {
    var info = extractMonth(h.data, h.id);
    return [h.data || '', info.key || 'SEM_MES', h.estabelecimento || '', h.cliente || '', h.metodoPagamento || '', toMoney(h.subtotal).toFixed(2), toMoney(h.gorjeta).toFixed(2), toMoney(h.total).toFixed(2)];
  });
  var csv = [headers].concat(rows).map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'fecha_conta_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

   BOOT E SINCRONIZAÇÃO AUTOMÁTICA
   ══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function() {
  try {
    var t = localStorage.getItem(THEME_KEY);
    if (t === 'dark') applyTheme('dark');
  } catch(e){}

  // Lê os dados na hora que abre
  reloadLS();

  // ⭐ Sincronização automática: se o app for atualizado em outra aba, o dashboard se atualiza sozinho
  window.addEventListener('storage', function(e) {
    if (e.key === LS_KEY) {
      console.log('Dados alterados no app. Atualizando dashboard...');
      reloadLS();
    }
  });
});
